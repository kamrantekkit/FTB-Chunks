name: Java CI - Build on Push

on:
  push:
    branches:
      - 1.20.1/main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle (remapJar)
        run: ./gradlew remapJar
      - name: Upload remapped JAR
        uses: actions/upload-artifact@v4
        with:
          name: remapped-jar
          path: forge/build/libs/ftb-chunks-forge-2001.3.6.jar